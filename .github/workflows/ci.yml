name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-quality:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check backend/app backend/tests
        continue-on-error: true

      - name: Ruff format check
        run: ruff format --check backend/app
        continue-on-error: true

      - name: Mypy
        run: mypy backend/app --ignore-missing-imports --python-version ${{ env.PYTHON_VERSION }}
        continue-on-error: true

      - name: Byte-compile
        run: python -m compileall -q backend/app

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redteam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/redteam_test
      SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      ENVIRONMENT: testing
      EVAL_MODE: local
      DEV_MOCK_JUDGE: "true"
      DEV_MOCK_TARGET_AGENT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate the JWT key pair
        run: python scripts/generate_keys.py

      - name: Run the test suite
        run: pytest backend/tests -v --tb=short --junitxml=backend-test-report.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend-test-report.xml

  frontend-quality:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Type check
        run: pnpm run typecheck
        working-directory: frontend

      - name: Lint
        run: pnpm run lint
        working-directory: frontend

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run the test suite
        run: pnpm run test -- --ci --coverage
        working-directory: frontend

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit
        run: bandit -r backend/app -ll -f screen

      - name: Dependency audit (Python)
        run: pip-audit --strict --requirement <(pip freeze | grep -v "^-e ") || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Dependency audit (Node)
        run: pnpm audit --audit-level=high
        working-directory: frontend

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-images:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-tests, frontend-quality, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: false
          load: true
          tags: artef-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: artef-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the backend image
        run: |
          docker run -d --name artef-backend-smoke -p 8000:8000 \
            -e SECRET_KEY=ci-secret-key-that-is-at-least-32-characters-long \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/artef.db \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e CELERY_BROKER_URL=redis://localhost:6379/1 \
            -e CELERY_RESULT_BACKEND=redis://localhost:6379/2 \
            -e EVAL_MODE=local \
            artef-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health > /dev/null; then
              echo "Backend health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          docker logs artef-backend-smoke
          exit 1
        finally: docker rm -f artef-backend-smoke || true
