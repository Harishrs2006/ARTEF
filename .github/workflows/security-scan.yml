name: Security Scan

# Real scanners. Dependency and static-analysis findings are REPORTED (uploaded as
# artifacts, job stays green) because the inherited codebase has not been triaged yet;
# switch `continue-on-error` off once the baseline findings are resolved.
# The model-scanner tests are a hard gate.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1"

jobs:
  python-dependencies:
    name: Python dependency audit (pip-audit, report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Audit locked dependencies
        continue-on-error: true
        run: pip-audit -r requirements.lock --format json --output pip-audit.json --progress-spinner off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit
          path: pip-audit.json

  python-static-analysis:
    name: Backend static security analysis (bandit, report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: Bandit (medium severity and above)
        continue-on-error: true
        run: bandit -r backend/app -ll -f json -o bandit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit
          path: bandit.json

  frontend-dependencies:
    name: Frontend dependency audit (pnpm audit, report only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable && corepack prepare pnpm@10.18.0 --activate
      - name: Audit (high and critical)
        continue-on-error: true
        run: pnpm audit --audit-level high

  model-scanner:
    name: Model security scanner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Pickle scanner detects code-executing payloads without loading them
        run: pytest backend/tests/unit/test_pickle_scanner.py -v -p no:cacheprovider
